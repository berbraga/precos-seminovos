name: Coleta de precos Mercado Livre

on:
  schedule:
    - cron: '30 1 * * 1'      # domingo 22:30 BRT = segunda 01:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: precos-ml
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: autotest (sem rede, sem credencial)
        run: python ml_coleta.py --autotest

      - name: instalar playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: debug-endpoints (temporario)
        run: python debug_endpoints.py

      - name: publicar
        run: |
          git add ml_precos.json
          if ! git diff --cached --quiet -- ml_precos.json; then
            git config user.name "coleta-precos[bot]"
            git config user.email "coleta-precos[bot]@users.noreply.github.com"
            git commit -m "chore: atualiza ml_precos.json"
            git push
          else
            echo "sem mudancas em ml_precos.json, pulando publicacao"
          fi

      - name: resumo
        if: always()
        run: |
          if [ ! -f ml_precos.json ]; then
            echo "## Coleta Mercado Livre — FALHOU" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "ml_precos.json nao foi gerado." >> "$GITHUB_STEP_SUMMARY"
          else
            python resumo.py >> "$GITHUB_STEP_SUMMARY"
          fi
