name: Coleta de precos Mercado Livre

on:
  schedule:
    - cron: '30 1 * * 1'      # domingo 22:30 BRT = segunda 01:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: precos-ml
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: autotest (sem rede, sem credencial)
        run: python ml_coleta.py --autotest

      - name: coleta
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        run: python ml_coleta.py

      - name: persistir refresh_token rotacionado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f .new_refresh_token ]; then
            echo "::add-mask::$(cat .new_refresh_token)"
            if [ -z "${GH_TOKEN}" ]; then
              echo "::error::GH_PAT nao configurado. O refresh_token rotacionou nesta execucao mas nao foi persistido no secret ML_REFRESH_TOKEN. A proxima execucao vai falhar com invalid_grant. Configure o secret GH_PAT (fine-grained PAT com permissao Secrets: Read and write neste repositorio)."
              exit 1
            fi
            gh secret set ML_REFRESH_TOKEN --body "$(cat .new_refresh_token)" --repo "${{ github.repository }}"
            rm -f .new_refresh_token
          fi

      - name: publicar
        run: |
          if ! git diff --quiet -- ml_precos.json; then
            git config user.name "coleta-precos[bot]"
            git config user.email "coleta-precos[bot]@users.noreply.github.com"
            git add ml_precos.json
            git commit -m "chore: atualiza ml_precos.json"
            git push
          else
            echo "sem mudancas em ml_precos.json, pulando publicacao"
          fi

      - name: resumo
        if: always()
        run: |
          if [ ! -f ml_precos.json ]; then
            echo "## Coleta Mercado Livre — FALHOU" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "ml_precos.json nao foi gerado." >> "$GITHUB_STEP_SUMMARY"
          else
            python resumo.py >> "$GITHUB_STEP_SUMMARY"
          fi
